<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アカデミア発シーズの事業化編 入門編</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2d2150; --ink2:#6b6390; --line:#eae4fb;
  --grape:#7c4dff; --rose:#ff5d8f; --sun:#ffb02e; --mint:#16c79a; --sky:#19b7f5;
  --pale:#f3edff; --card:#ffffff; --bg:#faf7ff;
  --r:22px; --sh:0 10px 0 rgba(124,77,255,.13), 0 18px 40px rgba(80,50,160,.13);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  font-family:"M PLUS Rounded 1c",system-ui,sans-serif; color:var(--ink);
  background:
    radial-gradient(900px 500px at 8% -8%, #ffe9f3 0%, rgba(255,233,243,0) 60%),
    radial-gradient(800px 500px at 102% 4%, #e3f6ff 0%, rgba(227,246,255,0) 58%),
    radial-gradient(700px 600px at 50% 110%, #eafaf3 0%, rgba(234,250,243,0) 60%),
    var(--bg);
  min-height:100vh; line-height:1.78; -webkit-text-size-adjust:100%;
}
.app{max-width:560px; margin:0 auto; padding:0 15px 60px}

/* ===== ヘッダ ===== */
.top{position:sticky; top:0; z-index:30; padding:9px 0 8px;
  background:linear-gradient(180deg, var(--bg) 72%, rgba(250,247,255,0));}
.toprow{display:flex; align-items:center; gap:8px}
.chip{display:inline-flex; align-items:center; gap:5px; background:#fff; border:2.5px solid var(--line);
  border-radius:999px; padding:5px 11px; font-size:11.5px; font-weight:800; color:var(--ink2); white-space:nowrap}
.chip b{color:var(--grape); font-size:13px}
.chip.word{border-color:#ffe2b0; color:#a9712a; cursor:pointer}
.chip.word b{color:var(--sun)}
.chip.word:active{transform:scale(.95)}
.dots{display:flex; gap:4px; flex:1; align-items:center}
.dot{flex:1; height:6px; border-radius:99px; background:#e7e0f8; transition:.3s}
.dot.on{background:var(--grape)} .dot.now{background:var(--rose); transform:scaleY(1.9)}

/* ===== メーター ===== */
.bars{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:8px}
.bar{background:#fff; border:2.5px solid var(--line); border-radius:15px; padding:7px 9px 8px}
.bar.c1{border-color:#d9c9ff} .bar.c2{border-color:#ffd3e1} .bar.c3{border-color:#ffe6b8}
.bl{display:flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; color:var(--ink2); margin-bottom:5px}
.ico{width:13px; height:13px; flex:none}
.bar.c1 .ico{color:var(--grape)} .bar.c2 .ico{color:var(--rose)} .bar.c3 .ico{color:var(--sun)}
.bv{display:flex; gap:3px}
.bv i{flex:1; height:8px; border-radius:99px; background:#eee7fb; transition:.25s}
.bar.c1 .bv i.on{background:var(--grape)} .bar.c2 .bv i.on{background:var(--rose)} .bar.c3 .bv i.on{background:var(--sun)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.bar.pop{animation:pop .45s}

/* ===== カード ===== */
.scene{background:var(--card); border:3px solid #fff; border-radius:var(--r); box-shadow:var(--sh);
  overflow:hidden; margin-top:12px; animation:rise .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{opacity:0; transform:translateY(16px) scale(.98)}to{opacity:1; transform:none}}
.art{display:block; width:100%; height:auto; background:linear-gradient(170deg,#fbf8ff,#f3edff)}
.scene-bd{padding:16px 17px 4px}
.scene-bd h2{margin:0 0 9px; font-size:20px; font-weight:900; letter-spacing:.2px; line-height:1.4}
.scene-bd p{margin:0 0 12px; font-size:14.5px; color:#453a6b}
.say{background:linear-gradient(135deg,#fff6fa,#f4f0ff); border:2.5px dashed #ffd3e1; border-radius:16px;
  padding:11px 13px; margin:0 0 12px; font-size:14px; font-weight:700; color:#6c3f6b; position:relative}
.say .who{display:block; font-size:10.5px; font-weight:800; color:var(--rose); margin-bottom:3px; letter-spacing:.4px}
.tagline{display:inline-block; background:var(--pale); color:var(--grape); font-size:10.5px; font-weight:900;
  border-radius:999px; padding:2px 10px; margin-bottom:8px; letter-spacing:.4px}

/* ===== 選択肢 ===== */
.choices{padding:4px 13px 15px; display:grid; gap:9px}
.ch{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%; cursor:pointer;
  background:#fff; border:3px solid var(--line); border-radius:17px; padding:12px 13px;
  font:inherit; font-size:14.5px; font-weight:800; color:var(--ink); transition:.16s; box-shadow:0 4px 0 #ece5fb}
.ch:hover{border-color:#c9b4ff; transform:translateY(-1px)}
.ch:active{transform:translateY(3px); box-shadow:0 1px 0 #ece5fb}
.ch .n{flex:none; width:25px; height:25px; border-radius:50%; background:var(--grape); color:#fff;
  display:grid; place-items:center; font-size:12.5px; font-weight:900; margin-top:1px}
.ch:nth-child(2) .n{background:var(--sky)} .ch:nth-child(3) .n{background:var(--mint)}
.ch:nth-child(4) .n{background:var(--sun)} .ch:nth-child(5) .n{background:var(--rose)}
.ch small{display:block; font-size:11.5px; font-weight:600; color:var(--ink2); margin-top:2px; line-height:1.6}

/* ===== 結果 ===== */
.res{padding:2px 15px 16px}
.res-box{border-radius:17px; padding:13px 14px; font-size:14px; font-weight:700; margin-bottom:11px; border:3px solid}
.res-box.good{background:#eafaf3; border-color:#b6ecd9; color:#0d6a52}
.res-box.soso{background:#fff7e8; border-color:#ffe0ab; color:#8a5c13}
.res-box.bad{background:#fff0f4; border-color:#ffcada; color:#9c2a4e}
.deltas{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
.delta{font-size:11px; font-weight:900; border-radius:999px; padding:3px 10px; background:#fff}
.delta.up{color:var(--mint); border:2px solid #b6ecd9} .delta.down{color:var(--rose); border:2px solid #ffcada}
.memo{background:linear-gradient(135deg,#fffaf0,#fff5fa); border:3px solid #ffe6b8; border-radius:17px;
  padding:12px 14px; font-size:13.5px; color:#6a5530; margin-bottom:12px}
.memo b{display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:900; color:#d08900;
  margin-bottom:5px; letter-spacing:.5px}
.memo b .ico{width:14px; height:14px; color:var(--sun)}
.pharma{background:linear-gradient(135deg,#eef8ff,#f2fbff); border:3px solid #bfe6fb; border-radius:17px;
  padding:12px 14px; font-size:13.5px; color:#1d5572; margin-bottom:12px}
.pharma b{display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:900; color:#1189c4;
  margin-bottom:5px; letter-spacing:.5px}
.pharma b .ico{width:14px; height:14px; color:var(--sky)}
.btn{display:block; width:100%; cursor:pointer; border:none; border-radius:17px; padding:14px;
  font:inherit; font-size:15.5px; font-weight:900; color:#fff; letter-spacing:.6px;
  background:linear-gradient(135deg,var(--grape),var(--rose)); box-shadow:0 5px 0 #5c33cc; transition:.14s}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 #5c33cc}
.btn.alt{background:linear-gradient(135deg,var(--sky),var(--mint)); box-shadow:0 5px 0 #0f93c4}
.btn.ghost{background:#fff; color:var(--grape); border:3px solid var(--line); box-shadow:0 5px 0 #ece5fb}

/* ===== 用語 ===== */
j{border-bottom:2.5px dotted var(--sun); cursor:pointer; font-weight:800; color:#b5760e; padding-bottom:1px}
j:active{background:#fff3d9}
j.seen{border-bottom-color:#e2d6f5; color:inherit; font-weight:inherit}
.scrim{position:fixed; inset:0; z-index:60; background:rgba(45,33,80,.52); backdrop-filter:blur(4px);
  display:flex; align-items:flex-end; justify-content:center; padding:14px; animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:#fff; border-radius:26px; border:4px solid #fff; box-shadow:0 -6px 50px rgba(60,30,120,.3);
  width:100%; max-width:530px; max-height:84vh; overflow:auto; animation:up .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes up{from{transform:translateY(40px); opacity:.5}to{transform:none; opacity:1}}
.sheet-hd{display:flex; align-items:center; gap:9px; padding:16px 17px 0}
.sheet-hd .bubble{width:38px; height:38px; border-radius:13px; display:grid; place-items:center; flex:none;
  background:linear-gradient(135deg,#fff0d4,#ffe3ef); font-size:19px}
.sheet-hd h3{margin:0; font-size:18px; font-weight:900}
.sheet-hd .en{font-size:11px; font-weight:700; color:var(--ink2); letter-spacing:.3px}
.sheet-bd{padding:11px 17px 4px; font-size:14px; color:#453a6b}
.sheet-bd p{margin:0 0 10px}
.sheet-ft{padding:4px 15px 16px}
.glos{display:grid; gap:7px; padding:4px 15px 16px}
.gl{display:flex; gap:9px; align-items:flex-start; background:#fcfaff; border:2.5px solid var(--line);
  border-radius:14px; padding:9px 11px; cursor:pointer; text-align:left; font:inherit; width:100%}
.gl:active{transform:scale(.99)}
.gl .gi{flex:none; font-size:16px}
.gl .gn{font-size:13.5px; font-weight:900}
.gl .gs{font-size:11.5px; color:var(--ink2); font-weight:600; line-height:1.55}
.gl.locked{opacity:.42}

/* ===== タイトル／結末 ===== */
.hero{text-align:center; padding:26px 16px 8px}
.hero .kicker{font-size:11.5px; font-weight:900; letter-spacing:2.6px; color:var(--rose)}
.hero h1{margin:5px 0 4px; font-size:29px; font-weight:900; line-height:1.3;
  background:linear-gradient(100deg,var(--grape),var(--rose) 48%,var(--sun));
  -webkit-background-clip:text; background-clip:text; color:transparent}
.hero .sub{font-size:13.5px; color:var(--ink2); font-weight:700}
.pills{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:12px 0 2px}
.pill{font-size:11px; font-weight:900; border-radius:999px; padding:4px 11px; background:#fff; border:2.5px solid var(--line); color:var(--ink2)}
.end-hero{text-align:center; padding:6px 0 2px}
.medal{width:106px; height:106px; display:block; margin:0 auto 4px}
.end-title{font-size:24px; font-weight:900; margin:0}
.end-sub{font-size:19px; letter-spacing:4px; color:var(--sun); margin-top:2px}
.learned{background:#fcfaff; border:3px solid var(--line); border-radius:18px; padding:13px 15px; margin:12px 0}
.learned h4{margin:0 0 8px; font-size:12px; font-weight:900; color:var(--grape); letter-spacing:.6px}
.learned li{font-size:13.5px; margin-bottom:7px; color:#453a6b; font-weight:700}
.learned ul{margin:0; padding-left:19px}
.nextup{background:linear-gradient(135deg,#2d2150,#4a2f82); border-radius:20px; padding:17px 17px 15px; margin:13px 0 0; color:#fff}
.nextup h4{margin:0 0 6px; font-size:16px; font-weight:900}
.nextup p{margin:0 0 12px; font-size:13.5px; color:#d6cdf2}
.nextup a{display:block; text-align:center; text-decoration:none; background:linear-gradient(135deg,var(--sun),var(--rose));
  color:#fff; font-weight:900; font-size:15px; border-radius:15px; padding:13px; box-shadow:0 5px 0 #c4396a}
.nextup a:active{transform:translateY(4px); box-shadow:0 1px 0 #c4396a}
.foot{text-align:center; font-size:10.5px; color:#9b93b8; margin-top:16px; line-height:1.85; font-weight:600}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="top" hidden>
    <div class="toprow">
      <div class="dots" id="dots"></div>
      <button class="chip word" id="wordChip" type="button">📖 用語 <b id="wordN">0</b></button>
    </div>
    <div class="bars" id="bars"></div>
  </div>
  <div id="wrap"></div>
  <div class="foot">
    制度の名称と金額は2026年11月時点の公募要領にもとづく実在のものです。<br>登場するVC・企業・人物は架空です。
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const el = h => { const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstElementChild; };
const rnd = n => Math.floor(Math.random()*n);

/* ===================== 用語辞典 ===================== */
const WORDS = {
  seeds:{n:"シーズ", en:"seeds", i:"🌱", s:"薬のもとになりそうな研究成果",
    b:"薬のもとになりそうな研究成果のこと。種という意味です。化合物のような「モノ」だけでなく、標的の発見、評価系、モデル動物、技術そのものもシーズと呼ばれます。<br><br>アカデミアの先生が「うちにシーズがあります」と言うとき、相手が想像しているものと実際が食い違っていることがよくあるので、何がどこまであるのかを具体的に言うほうが話が早く進みます。"},
  target:{n:"標的（ターゲット）", en:"target", i:"🎯", s:"薬が結合して効かせたい分子",
    b:"薬が結合して、働きを変えたい相手の分子のこと。多くはタンパク質です。<br><br>「この遺伝子をノックアウトしたら病気が良くなった」は標的の候補が見つかったということで、まだ薬があるわけではありません。標的と薬は別のものです。"},
  moa:{n:"MoA（作用機序）", en:"Mechanism of Action", i:"⚙️", s:"どういう仕組みで効くのか",
    b:"その薬が、体の中のどこに、どう働いて効果を出すのかという説明のこと。<br><br>効いているデータがあっても、なぜ効くのかが説明できないと開発は進めにくくなります。途中で副作用が出たときに、原因を切り分けられないからです。"},
  modality:{n:"モダリティ", en:"modality", i:"💊", s:"薬の形（低分子・抗体・核酸・細胞など）",
    b:"薬の形のこと。低分子、抗体やペプチドなどのタンパク質、核酸（ASOやmRNA）、細胞・遺伝子治療などに分かれます。<br><br>同じ標的を狙っても、どの形で作るかで必要な実験、費用、製造の難しさ、規制の進み方、組む相手が全部変わります。"},
  assay:{n:"アッセイ", en:"assay", i:"🧪", s:"効果や性質を測る実験系",
    b:"効果や性質を測るための実験系のこと。細胞を使うもの、タンパク質だけを使うもの、動物を使うものがあります。<br><br>創薬ではこの評価系の良し悪しがプロジェクト全体の速さを決めます。良い評価系がないと、どの化合物が良いのか判断できません。"},
  window:{n:"アッセイウィンドウ", en:"assay window", i:"📏", s:"効いた群と効かない群の差の大きさ",
    b:"効いている条件と効いていない条件の、測定値の差の大きさのこと。シグナル幅とも言います。<br><br>「統計的に有意」と「差が大きい」は別の話です。n数を増やせば小さな差でも有意になりますが、差そのものが小さいと、薬にしたときの効き目も小さいかもしれない。製薬企業はこの幅を必ず見ます。"},
  n:{n:"n数", en:"sample size", i:"🔢", s:"何回・何匹・何検体で確かめたか",
    b:"何回、何匹、何検体で確かめたかという数のこと。<br><br>同じ日に同じプレートで3ウェル測ったものを n=3 と書くのと、別の日に独立して3回やり直したものを n=3 と書くのでは、意味がまったく違います。後者を独立実験といい、創薬の側が見たいのはこちらです。"},
  repro:{n:"再現性", en:"reproducibility", i:"🔁", s:"誰がやっても同じ結果になるか",
    b:"同じ実験をもう一度やったとき、同じ結果が出るかどうか。さらに、別の人が、別の施設でやっても出るかどうか。<br><br>創薬で最も重視される性質のひとつです。1回うまくいった現象より、何度やっても同じように出る現象のほうが価値があります。"},
  effect:{n:"エフェクトサイズ", en:"effect size", i:"📐", s:"効果の大きさそのもの",
    b:"効果の大きさそのものを表す指標。p値が「差があると言えるか」を答えるのに対して、こちらは「どれくらい差があるか」を答えます。<br><br>論文ではp値だけが書かれていることが多いのですが、開発の判断に使うのは効果の大きさのほうです。"},
  pval:{n:"p値と多重比較", en:"p-value", i:"📊", s:"有意差の出し方にも作法がある",
    b:"p値は、偶然でもこれくらいの差は出るのか、を見る指標です。慣習的に0.05未満を有意とします。<br><br>気をつけるのは、たくさんの比較を同時にすると、偶然だけで有意になるものが出てくること。これを補正する手続きを多重比較補正といいます。補正されていない大量の比較は、創薬の側から見ると割り引いて読まれます。"},
  control:{n:"ポジコン・ネガコン", en:"positive / negative control", i:"⚖️", s:"実験系が正しく動いている証拠",
    b:"効くとわかっているものを入れたとき確かに効く（ポジティブコントロール）、効かないはずのものを入れたとき効かない（ネガティブコントロール）。この2つが揃って、はじめて実験系が信用できます。<br><br>新しい現象の報告でここが抜けていると、現象そのものより実験系が疑われます。"},
  blind:{n:"ブラインド", en:"blinding", i:"🙈", s:"どの群か知らずに測る",
    b:"測定する人が、その検体がどの群なのかを知らない状態で測ること。<br><br>特に組織像のスコアリングや行動実験のように、人の判断が入る測定では、無意識の偏りが入ります。ブラインドされているかどうかは、データの信頼度を大きく変えます。"},
  mm:{n:"M&M（材料と方法）", en:"Materials and Methods", i:"📋", s:"他人が再現できる書き方か",
    b:"論文の実験方法の節のこと。<br><br>創薬の側は、ここを「自分たちのラボで同じことができるか」という目で読みます。抗体のメーカーと製品番号、細胞の由来と継代数、試薬のロット、装置の設定、解析のコード。ここが薄いと、技術の評価以前に再現実験の計画が立ちません。"},
  image:{n:"代表画像と定量", en:"representative image", i:"🖼️", s:"きれいな一枚ではなく数値で",
    b:"きれいな一枚の写真は説得力がありますが、それ1枚では何回やって何枚のうちの1枚なのかがわかりません。<br><br>視野をいくつ取って、どう数値化して、ばらつきはどうだったか。画像が定量されているかどうかは、論文を読む創薬研究者が最初に見るところのひとつです。"},
  tpp:{n:"TPP（目標製品プロファイル）", en:"Target Product Profile", i:"🗺️", s:"どんな薬にしたいかの設計図",
    b:"最終的にどんな製品にしたいかを、項目ごとに言葉にした設計図。対象疾患、投与経路、効果の目標、安全性の許容範囲、既存治療との差を書きます。<br><br>これがあると、取るべきデータが逆算で決まります。一度書いて終わりではなく、結果が出るたびに改訂していくものです。"},
  poc:{n:"PoC（概念実証）", en:"Proof of Concept", i:"✅", s:"考えが正しいと示す一番の実験",
    b:"自分の仮説が本当に成り立つことを示す、いちばん重要な実験のこと。<br><br>非臨床のPoCは、たとえば病気のモデル動物で狙った効果が出ること。臨床のPoCは、患者さんで効果の兆しが見えること。資金調達の節目はたいていここに置かれます。"},
  unmet:{n:"アンメットニーズ", en:"unmet medical needs", i:"🩹", s:"まだ満たされていない医療の必要",
    b:"今ある治療では足りていない医療上の必要のこと。<br><br>患者数が多いかどうかだけでなく、既存の治療があるかどうかで見ます。患者数が少なくても、治療法がまったくない病気なら価値は高く評価されます。"},
  biomarker:{n:"バイオマーカー", en:"biomarker", i:"🔖", s:"効く人を見分ける目印",
    b:"病気の状態や、薬が効いているかどうかを示す、測れる指標のこと。血液中の分子、画像、遺伝子変異などがあります。<br><br>効く患者さんを事前に選べると、臨床試験が小さく速くなります。バイオマーカーがあるプロジェクトが高く評価されるのはこのためです。"},
  nonclin:{n:"非臨床試験", en:"preclinical study", i:"🐭", s:"ヒトに入れる前の試験",
    b:"ヒトに投与する前に行う試験の総称。効果を見る薬理試験、体内での動きを見る薬物動態、安全性を見る毒性試験があります。<br><br>このうち安全性の試験は、GLPという決められた基準の下で実施したものでないと、治験の申請には使えません。"},
  glp:{n:"GLP", en:"Good Laboratory Practice", i:"📑", s:"安全性試験の品質基準",
    b:"安全性試験を行うときに守るべき、国で決められた品質管理の基準のこと。<br><br>大学の実験室で得たデータは、どれだけ質が高くてもGLPではありません。治験に進むには、GLPに対応した施設での試験をやり直すことになります。費用も時間も別に必要です。"},
  clin:{n:"治験", en:"clinical trial", i:"🏥", s:"ヒトで調べる試験",
    b:"薬の候補をヒトで調べる試験のこと。安全性を主に見る第1相、効く量や効果の兆しを見る第2相、既存治療と比べる第3相と進みます。<br><br>ここから費用の桁が変わります。アカデミアが単独で走らせるのは難しく、企業や大型の公的資金が必要になる段階です。"},
  pmda:{n:"PMDA", en:"医薬品医療機器総合機構", i:"🏛️", s:"薬を審査する国の機関",
    b:"医薬品や医療機器の審査と安全対策を担う国の機関。<br><br>開発の早い段階から相談できる仕組みがあり、無料のRS総合相談と事前面談、正式な記録が残る有料の対面助言があります。大学やベンチャーには手数料の低額要件もあります。"},
  cro:{n:"CRO", en:"Contract Research Organization", i:"🔬", s:"試験を請け負ってくれる会社",
    b:"試験を請け負って実施してくれる会社。薬物動態、毒性、薬理の試験などを外注できます。<br><br>自分のラボでやるより費用はかかりますが、手順が標準化されているので、データの信頼度は上がります。何を内製して何を外注するかは、先に項目ごとに決めておくのが鉄則です。"},
  cdmo:{n:"CDMO", en:"Contract Development and Manufacturing Organization", i:"🏭", s:"薬を作ってくれる会社",
    b:"薬そのものの製造を開発段階から請け負ってくれる会社。<br><br>細胞・遺伝子治療や抗体では、作れるCDMOの数が限られていて枠の取り合いになります。効果のデータが揃っていても、作る場所が押さえられないと先に進めません。"},
  tlo:{n:"TLO・産学連携本部", en:"Technology Licensing Organization", i:"🏫", s:"大学の技術移転の窓口",
    b:"大学の研究成果を企業に渡したり、特許を管理したりする窓口。大学によって産学連携本部、知財部門、TLOなど呼び方が違います。<br><br>薬にしたいと思ったら最初に相談する場所です。特許の出願費用を大学が負担してくれる場合もあります。"},
  ip:{n:"知財（特許）", en:"intellectual property", i:"🔒", s:"独占して使える権利",
    b:"発明を一定期間、独占して実施できる権利のこと。<br><br>創薬では特許がすべての前提になります。誰でも真似できる技術には、何百億円もかけて開発する人が現れないからです。"},
  novelty:{n:"新規性", en:"novelty", i:"🆕", s:"まだ誰も公表していないこと",
    b:"特許が認められる条件のひとつで、出願の時点でまだ世の中に公表されていないこと。<br><br>学会発表や論文で先に公表してしまうと、新規性が失われるおそれがあります。発表の前に出願するのが原則です。"},
  shokumu:{n:"職務発明", en:"employee invention", i:"🏢", s:"権利は原則として大学のもの",
    b:"大学や会社の業務として生まれた発明のこと。権利は原則として所属機関に帰属します。<br><br>つまり自分が出した成果でも、自分の会社で使うには大学からライセンスを受ける必要があり、対価も発生します。"},
  vc:{n:"VC（ベンチャーキャピタル）", en:"Venture Capital", i:"💼", s:"株を持つ形でお金を入れる投資家",
    b:"将来伸びそうな会社に、株を持つ形でお金を入れる投資家。<br><br>創薬に投資するVCにも種類があり、資金を入れるだけのところ、研究員を派遣してくれるところ、申請書を一緒に書いてくれるところがあります。事務所ごとに方針も人手も違うので、誰と組むかは大きな分かれ目です。"},
  cvc:{n:"CVC", en:"Corporate Venture Capital", i:"🏢", s:"事業会社が持つ投資部門",

  equity:{n:"エクイティと希薄化", en:"equity / dilution", i:"🥧", s:"株でお金を集めると持分が減る",

  grant:{n:"助成金（グラント）", en:"grant", i:"🎁", s:"返さなくていい、株も渡さないお金",

  dd:{n:"デューデリジェンス", en:"due diligence", i:"🔍", s:"投資や導出の前の詳しい調査",

/* ===================== 状態 ===================== */
let S = { data:1, team:0, money:2, i:0, flags:{}, disc:null, seen:{} };
const MAXP = 6;
const clamp = v => Math.max(0, Math.min(MAXP, v));
const val = v => typeof v === "function" ? v() : v;

/* ===================== 用語ポップアップ ===================== */
function openWord(k){
  const w = WORDS[k]; if(!w) return;
  const isNew = !S.seen[k];
  S.seen[k] = true; updateWordChip();
  const sc = el(`<div class="scrim"><div class="sheet">
    <div class="sheet-hd"><div class="bubble">${w.i}</div>
      <div><h3>${w.n}</h3><div class="en">${w.en}${isNew?' ・ はじめて見る用語':''}</div></div></div>
    <div class="sheet-bd"><p>${w.b}</p></div>
    <div class="sheet-ft"><button class="btn ghost" type="button">とじる</button></div>
  </div></div>`);
  const close = ()=>sc.remove();
  sc.querySelector("button").addEventListener("click", close);
  sc.addEventListener("click", e=>{ if(e.target===sc) close(); });
  wireWords(sc);
  document.body.appendChild(sc);
}
function openGlossary(){
  const got = Object.keys(S.seen).length;
  const sc = el(`<div class="scrim"><div class="sheet">
    <div class="sheet-hd"><div class="bubble">📖</div>
      <div><h3>用語集</h3><div class="en">${got} / ${WORD_ORDER.length} 個ひらいた</div></div></div>
    <div class="glos" id="glosList"></div>
    <div class="sheet-ft"><button class="btn ghost" type="button">とじる</button></div>
  </div></div>`);
  const list = sc.querySelector("#glosList");
  WORD_ORDER.forEach(k=>{
    const w = WORDS[k], seen = !!S.seen[k];
    const b = el(`<button class="gl ${seen?'':'locked'}" type="button">
      <span class="gi">${w.i}</span>
      <span><span class="gn">${w.n}</span><br><span class="gs">${w.s}</span></span></button>`);
    b.addEventListener("click", ()=>{ sc.remove(); openWord(k); });
    list.appendChild(b);
  });
  const close = ()=>sc.remove();
  sc.querySelector(".sheet-ft button").addEventListener("click", close);
  sc.addEventListener("click", e=>{ if(e.target===sc) close(); });
  document.body.appendChild(sc);
}
function wireWords(root){
  root.querySelectorAll("j[data-k]").forEach(n=>{
    if(n.dataset.wired) return; n.dataset.wired = "1";
    if(S.seen[n.dataset.k]) n.classList.add("seen");
    n.addEventListener("click", e=>{ e.stopPropagation(); openWord(n.dataset.k); });
  });
}
function updateWordChip(){
  const n = $("wordN"); if(n) n.textContent = Object.keys(S.seen).length;
}

/* ===================== 描画 ===================== */
function bars(flash){
  const defs = [["data","データ","c1"],["team","なかま","c2"],["money","おかね","c3"]];
  $("bars").innerHTML = defs.map(([k,label,c])=>`
    <div class="bar ${c} ${flash&&flash[k]?'pop':''}">
      <div class="bl">${ICON[k]}${label}</div>
      <div class="bv">${Array.from({length:MAXP},(_,i)=>`<i class="${i<S[k]?'on':''}"></i>`).join("")}</div>
    </div>`).join("");
}
function dots(){
  $("dots").innerHTML = SCENES.map((_,i)=>`<span class="dot ${i<S.i?'on':''} ${i===S.i?'now':''}"></span>`).join("");
}
function paint(html){
  $("wrap").innerHTML = ""; const c = el(html); $("wrap").appendChild(c);
  wireWords(c); window.scrollTo({top:0, behavior:"smooth"}); return c;
}

/* ===================== シーン ===================== */
function renderScene(){
  const sc = SCENES[S.i];
  $("top").hidden = false; dots(); bars(); updateWordChip();
  const c = paint(`<div class="scene">${ART[sc.art]}
    <div class="scene-bd">
      ${sc.tag?`<span class="tagline">${sc.tag}</span>`:""}

      ${sc.say?`<div class="say"><span class="who">${val(sc.who)||""}</span>「${val(sc.say)}」</div>`:""}
      <p>${val(sc.text)}</p>
    </div>
    <div class="choices" id="chBox"></div></div>`);
  const box = c.querySelector("#chBox");
  val(sc.choices).forEach((ch,i)=>{
    const b = el(`<button class="ch" type="button"><span class="n">${i+1}</span>
      <span>${ch.t}${ch.sub?`<small>${ch.sub}</small>`:""}</span></button>`);
    b.addEventListener("click", ()=>pick(ch));
    box.appendChild(b);
  });
}

function pick(ch){
  const sc = SCENES[S.i];
  if(sc.final){ S.ending = ch.ending; return showEnding(); }
  const before = {data:S.data, team:S.team, money:S.money};
  if(ch.fx) for(const k in ch.fx) S[k] = clamp(S[k] + ch.fx[k]);
  if(ch.flag) S.flags[ch.flag] = true;
  const flash = {data:S.data!==before.data, team:S.team!==before.team, money:S.money!==before.money};
  bars(flash);
  const deltas = ["data","team","money"].map(k=>{
    const d = S[k]-before[k]; if(!d) return "";
    const label = {data:"データ",team:"なかま",money:"おかね"}[k];
    return `<span class="delta ${d>0?'up':'down'}">${label} ${d>0?'+':''}${d}</span>`;
  }).join("");
  const memo = ch.memo || sc.memo;
  const c = paint(`<div class="scene">${ART[sc.art]}
    <div class="scene-bd"><h2>${val(sc.title)}</h2></div>
    <div class="res">
      <div class="res-box ${ch.kind||'soso'}">${ch.res}${deltas?`<div class="deltas">${deltas}</div>`:""}</div>
      ${memo?`<div class="memo"><b>${ICON.bulb}ひとくちメモ</b>${memo}</div>`:""}
      ${sc.pharma?`<div class="pharma"><b>${ICON.eye}製薬企業は、ここを見ています</b>${sc.pharma}</div>`:""}
      <button class="btn" id="next" type="button">つぎへ</button>
    </div></div>`);
  c.querySelector("#next").addEventListener("click", ()=>{
    S.i++; if(S.i >= SCENES.length) showEnding(); else renderScene();
  });
}

function showEnding(){
  const e = ENDINGS[S.ending] || ENDINGS.grant;
  const total = S.data + S.team + S.money;
  const stars = total>=14 ? "★★★" : total>=10 ? "★★☆" : "★☆☆";
  const got = Object.keys(S.seen).length;
  let learned = LESSONS.filter(([f])=>S.flags[f]).map(([,t])=>t);
  if(!learned.length) learned = ["まずは大学の窓口に相談するところから"];
  $("top").hidden = true;
  const c = paint(`<div><div class="scene"><div class="scene-bd" style="padding-bottom:6px">
    <div class="end-hero">${ART.medal(e.c[0], e.c[1])}

    <p style="margin-top:12px">${e.text}</p>
    <div class="memo"><b>${ICON.bulb}ひとくちメモ</b>${e.memo}</div>
    <div class="learned"><h4>このプレイで通った道</h4><ul>${learned.map(t=>`<li>${t}</li>`).join("")}</ul></div>
    <div class="learned" style="border-color:#ffe6b8; background:#fffaf0">
      <h4 style="color:#d08900">ひらいた用語　${got} / ${WORD_ORDER.length}</h4>
      <p style="margin:0; font-size:13.5px; color:#6a5530; font-weight:700">
        ${got>=25?"かなり読めるようになりました。申請書も怖くないはずです。":got>=15?"だいぶ掴めてきました。用語集で残りも見てみてください。":"まだ開いていない言葉がたくさんあります。用語集をのぞいてみてください。"}</p>
      <button class="btn ghost" id="openGl" type="button" style="margin-top:10px">用語集をひらく</button>
    </div>
    <div class="nextup">
      <h4>ここから先、本格的にやってみたい人へ</h4>
      <p>フルバージョンでは、実在の助成金制度を名指しで扱います。ギャップファンドからD-Global、AMEDの橋渡し拠点まで、どの枠にいつ出すか。四半期ごとに自分の時間を配り、VCと組み、審査のヒアリングに答え、28ターンで事業化まで持っていくシミュレーションです。</p>
      <a href="https://claude.ai/artifact/RdTxPnhjJMJrAW5wXiX5b5" target="_blank" rel="noopener">フルバージョンへ進む →</a>
    </div>
    <button class="btn alt" id="again" type="button" style="margin-top:12px">別の発見で、もう一度</button>
  </div></div></div>`);
  c.querySelector("#openGl").addEventListener("click", openGlossary);
  c.querySelector("#again").addEventListener("click", ()=>{
    const seen = S.seen;
    S = { data:1, team:0, money:2, i:0, flags:{}, disc:null, seen, ending:null };
    pickDisc();
  });
}

$("wordChip").addEventListener("click", openGlossary);
title();
